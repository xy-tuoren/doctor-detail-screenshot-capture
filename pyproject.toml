[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-detail-screenshot-capture"
version = "0.1.0"
description = "Doctor medical API tools and UI automation"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
capture-institution = [
    "uiautomation>=2.0.0",
    "pyperclip>=1.8.0",
    "Pillow>=10.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "pywin32>=306",
]
capture-nhc = [
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.0",
    "ddddocr>=1.4.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
