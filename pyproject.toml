[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-detail-screenshot-capture"
version = "0.1.0"
description = "Doctor medical API tools and UI automation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
